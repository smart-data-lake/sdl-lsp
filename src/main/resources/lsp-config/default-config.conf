# Files and directories forming the workspace, relative to the project root (like the --config option of the SDLB CLI).
# Directories are searched recursively for .conf files. Files outside these paths are handled in isolation.
# Remove this line to use all .conf files of the project.
configPaths = "./conf,./env/local.conf"

# SDLB version of the project, to use its schema. Defaults to the version found in the pom.xml of the project.
# Schemas are downloaded from smartdatalake.ch and cached in ~/.sdl-lsp/schemas (schemaDownload = false to only use the cache).
# Without version, the bundled schema of SDLB 3.0.0-SNAPSHOT is used.
# sdlbVersion = 2.8.1
# schemaDownload = true

# JSON schema file, relative to the project root, instead of the schema of the SDLB version.
# schemaPath = "schema/sdl-schema.json"

# Log level of the server (trace, debug, info, warn, error). Logs are written to ~/.sdl-lsp/logs and sent to the client.
# logLevel = info

