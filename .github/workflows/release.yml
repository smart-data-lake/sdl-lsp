name: Release

# Pushing a tag like v1.2.0 builds, tests and publishes the server jar as a GitHub release.
# Tags with a suffix like v1.2.0-rc1 are published as pre-releases.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test
        run: mvn -B package -Drevision="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Versioned jar, plus sdl-lsp.jar for the stable link releases/latest/download/sdl-lsp.jar
          mkdir -p release
          cp "target/sdl-lsp-${VERSION}-jar-with-dependencies.jar" "release/sdl-lsp-${VERSION}.jar"
          cp "target/sdl-lsp-${VERSION}-jar-with-dependencies.jar" release/sdl-lsp.jar
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" "release/sdl-lsp-${VERSION}.jar" release/sdl-lsp.jar \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRERELEASE
